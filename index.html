<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тигримион · Хроники Королевств</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="game-container">
    <div class="title">⚔️ ТИГРИМИОН · БИТВА КОРОЛЕВСТВ ⚔️</div>
    
    <div class="top-bar">
        <div class="round-info">🌀 Раунд <span id="roundDisplay">1</span></div>
        <div class="phase-indicator" id="phaseIndicator">🌾 ФАРМ-ФАЗА</div>
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="2">👥 2 Игрока</button>
            <button class="mode-btn" data-mode="pc">🤖 Против ПК</button>
        </div>
    </div>

    <div class="event-cards-row" id="eventCardsContainer"></div>

    <div class="arena" id="arenaContainer"></div>

    <div class="turn-indicator" id="turnIndicator"></div>

    <div class="actions-row">
        <button class="fight-btn" id="actionBtn">✅ ЗАКОНЧИТЬ ВЫБОР</button>
        <button class="fight-btn reset-btn" id="resetGame">🔄 НОВАЯ КАМПАНИЯ</button>
    </div>

    <div class="log" id="log">[⚔️] Тигримион ждёт. Выберите героя для Раунда 1.</div>
</div>

<!-- ========== МОДАЛЬНОЕ ОКНО ИНВЕНТАРЯ ========== -->
<div id="inventoryModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.92); backdrop-filter:blur(12px); z-index:20000; align-items:center; justify-content:center;">
    <div style="max-width:1100px; width:95%; max-height:90vh; background:linear-gradient(145deg, #1e261a, #0a0f07); border:3px solid #c9a45b; border-radius:30px; padding:25px; overflow-y:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; color:#ffdfa5; font-size:1.5rem; font-weight:bold; margin-bottom:15px; padding-bottom:10px; border-bottom:2px solid #c9a45b;">
            <span>🎒 ИНВЕНТАРЬ — ФРОНТ <span id="invPlayerId">1</span></span>
            <button id="closeInventoryBtn" style="background:none; border:none; color:#ffdfa5; font-size:28px; cursor:pointer; padding:5px 10px;">✕</button>
        </div>
        <div style="display:flex; gap:20px; flex-wrap:wrap;">
            <div style="flex:1; min-width:350px;">
                <h3 style="color:#ffdfa5; font-size:1.2rem; margin-bottom:12px; text-align:center;">🎽 ЭКИПИРОВКА</h3>
                <div id="equipSlots" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px;"></div>
                <div id="equipBonusInfo" style="margin-top:15px; padding:12px; background:rgba(0,0,0,0.4); border-radius:12px; border:1px solid #555;"></div>
            </div>
            <div style="flex:1; min-width:300px;">
                <h3 style="color:#ffdfa5; font-size:1.2rem; margin-bottom:12px; text-align:center;">🔮 ВСЕ РЕЛИКВИИ (<span id="relicTotalCount">0</span>)</h3>
                <div id="relicsList" style="max-height:400px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;"></div>
                <div style="text-align:center; margin-top:15px;">
                    <button id="unequipAllBtn" style="background:#5a2020; border:1px solid #ff4444; color:#ffaaaa; padding:8px 20px; border-radius:20px; cursor:pointer; font-size:0.8rem;">🗑️ СНЯТЬ ВСЁ</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ========== МОДАЛЬНОЕ ОКНО ДЕЙСТВИЙ И МАГАЗИНА ========== -->
<div id="relicChoiceModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.92); backdrop-filter:blur(12px); z-index:10000; align-items:center; justify-content:center;">
    <div id="relicChoiceContent" style="max-width:1200px; width:95%; max-height:90vh; background:linear-gradient(145deg, #1e261a, #0a0f07); border:3px solid #c9a45b; border-radius:40px; padding:30px; overflow-y:auto;"></div>
</div>

<!-- ========== МУЗЫКАЛЬНЫЙ ПЛЕЕР ========== -->
<audio id="bgMusic" preload="auto"></audio>

<div id="musicPlayer" class="music-player">
    <button id="togglePlaylist" class="music-toggle-btn" title="Открыть плейлист">🎵</button>
    
    <div id="playlistPanel" class="playlist-panel hidden">
        <div class="playlist-header">
            <span>🎧 ПЛЕЙЛИСТ</span>
            <button id="closePlaylist" class="playlist-close-btn">✕</button>
        </div>
        
        <div class="now-playing" id="nowPlaying">
            <span class="now-playing-icon">🎼</span>
            <span class="now-playing-text">Ничего не играет</span>
        </div>
        
        <div class="player-controls">
            <button id="prevTrackBtn" class="player-btn" title="Предыдущий трек">⏮️</button>
            <button id="playPauseBtn" class="player-btn player-btn-play" title="Воспроизвести">▶️</button>
            <button id="nextTrackBtn" class="player-btn" title="Следующий трек">⏭️</button>
        </div>
        
        <div class="volume-control">
            <span class="volume-icon">🔊</span>
            <input type="range" id="volumeSlider" min="0" max="100" value="30" class="volume-slider">
            <span id="volumeValue" class="volume-value">30%</span>
        </div>
        
        <div class="playlist-tracks" id="playlistTracks"></div>
    </div>
</div>

<script src="js/data.js"></script> 
<script src="js/core.js"></script>
</body>
</html>
